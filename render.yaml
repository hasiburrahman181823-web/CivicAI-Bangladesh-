services:
  - type: keyvalue
    name: civicai-bangladesh-rates
    plan: free
    region: oregon
    ipAllowList: []
    maxmemoryPolicy: noeviction
  - type: web
    name: civicai-bangladesh-live
    runtime: docker
    branch: civicai-account-profile
    plan: free
    region: oregon
    healthCheckPath: /api/health
    dockerfilePath: ./Dockerfile
    dockerCommand: sh /app/backend/start-render.sh
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: CORS_ORIGINS
        value: ""
      - key: DATABASE_URL
        sync: false
      - key: INTAKE_ENCRYPTION_KEY
        sync: false
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: civicai-bangladesh-rates
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_MFA_KEY
        generateValue: true
