version: '3.8'

services:
  db:
    image: postgis/postgis:15-3.3
    container_name: civicai_postgres
    restart: always
    environment:
      POSTGRES_DB: civicai_bd
      POSTGRES_USER: civic_admin
      POSTGRES_PASSWORD: CivicSecretPassword2026!
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U civic_admin -d civicai_bd"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ..
      dockerfile: deployment/Dockerfile
    container_name: civicai_backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://civic_admin:CivicSecretPassword2026!@db:5432/civicai_bd
      ENVIRONMENT: production
      DEBUG: "False"
      SECRET_KEY: ${SECRET_KEY:-civicai-super-secret-key-bd-2026-production-grade}
      CORS_ORIGINS: "http://localhost,http://localhost:80,http://localhost:5173"
    ports:
      - "8000:8000"
    volumes:
      - uploads_data:/app/uploads

  nginx:
    image: nginx:alpine
    container_name: civicai_nginx
    restart: always
    depends_on:
      - backend
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  postgres_data:
  uploads_data:
